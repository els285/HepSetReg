# Standard supervised regression on the toy dataset (see
# examples/make_toy_dataset.py). Run from the repo root:
#
#   python examples/make_toy_dataset.py
#   PYTHONPATH=examples hepsetreg-train --config configs/example_regression.yaml
#
seed: 42

model:
  mode: supervised
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  pooling: cls            # cls | mean | attention
  use_type_embedding: true
  output_dim: 2            # [system_mass, system_pt]
  groups:                  # order fixes the token concatenation order
    - name: jets
      in_features: 5        # pt, eta, phi, E, btag  (variable count per event)
    - name: leptons
      in_features: 4         # pt, eta, phi, E
    - name: met
      in_features: 2          # pt, phi
  head:
    n_layers: 2
    start_neurons: 64
    dropout: 0.05

loss:
  terms:
    regression:
      kind: huber
      delta: 1.0
      weight: 1.0
    distribution_kl:
      bins: 64
      sigma: 0.4
      eps: 1.0e-8
      weight: 0.1
      ramp_epochs: 5
    consistency:
      fn: "physics_hooks:toy_mass_consistency"
      weight: 0.05

data:
  group_names: [jets, leptons, met]
  train_file: examples/toy_data/train.h5
  val_file: examples/toy_data/val.h5
  test_file: examples/toy_data/test.h5
  target_key: target
  extra_keys: [truth_mass]
  scaler_file: examples/toy_data/scaler.h5
  batch_size: 128
  num_workers: 0

train:
  optimizer: adamw
  learning_rate: 5.0e-4
  weight_decay: 0.01
  lr_scheduler:
    enabled: true
    factor: 0.5
    patience: 5
    min_lr: 1.0e-7
    monitor: val_loss
  max_epochs: 30
  early_stopping_patience: 8
  monitor_metric: val_loss
  monitor_mode: min
  accelerator: auto
  devices: auto
  output_dir: training_logs/regression
