# Config for: python -m hepsetreg.runs.run_regression_flow --train|--predict --config configs/run_flowmatching.yaml

# field names as they appear in the parquet file -- shared by train and predict
features:
  global: [global_njet, global_nelectron, global_nmuon, global_nbtagged, global_met_met, global_met_phi]
  jet: [jet_pt, jet_eta, jet_phi, jet_e, jet_m, jet_px, jet_py, jet_pz, jet_bTag]
  lepton: [pt, eta, phi, e, m, px, py, pz, charge, is_electron]
  target: [ttbar_mass]

train:
  # data -- setup_bsc downloads these, so training runs out of the box.
  train_path: datasets/ttbar-2L_train_051026.parquet
  val_path: datasets/ttbar-2L_val_051026.parquet
  batch_size: 4096
  # backbone + velocity field architecture (TransformerVelocityField shares
  # these size knobs with TransformerBackbone -- see run_regression_flow.py)
  d_model: 128
  nhead: 8
  num_layers: 6
  # training
  max_epochs: 50
  learning_rate: 1.0e-3
  lr_patience: 2
  early_stop_patience: 5
  accelerator: gpu
  compile_model: true

predict:
  # fill in the actual run's version_N and checkpoint filename
  # (Lightning names it epoch=X-step=Y.ckpt by default)
  checkpoint: tb_logs/event_regression_flow/version_0/checkpoints/epoch=49-step=57300.ckpt
  stats: tb_logs/event_regression_flow/version_0/stats.pt
  data_path: datasets/ttbar-2L_test_051026.parquet
  batch_size: 4096
  accelerator: gpu
  output: ttbar-2L-inference-flow.parquet
  # ODE sampling: n_steps = integration steps, n_samples = draws per event
  # (predict_n_steps/predict_n_samples in FlowMatchingModule)
  n_steps: 20
  n_samples: 8
  # false (default): save the n_samples-average point estimate, one row per
  # event. true: save all n_samples individual draws per event instead (a
  # list column per target feature) -- e.g. for calibration/looking at the
  # predicted distribution, not just its mean.
  keep_all_samples: false
