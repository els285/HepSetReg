[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hepsetreg"
version = "0.1.0"
description = "PyTorch Lightning transformer-encoder package for regressing observables from variable-length sets of reconstructed physics objects (e.g. ATLAS jets/leptons/MET)."
readme = "README.md"
requires-python = "~=3.12.0"
license = { text = "MIT" }
authors = [{ name = "Ethan Simpson" }]
dependencies = [
    "torch==2.4.0",
    "lightning==2.4.0",
    "numpy>=1.26",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.8"]

[project.scripts]
hepsetreg-train = "hepsetreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
